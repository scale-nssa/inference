[project]
name = "inference"
version = "0.2.0"
description = "Thin, unified interface to Claude, Gemini, and GPT-OSS on Vertex AI, plus the Stanford AI API Gateway."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openai>=1.40",
    "anthropic[vertex]>=0.40",
    "google-genai>=0.3",
    "google-cloud-aiplatform>=1.153.1",
    "google-cloud-storage>=3.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference"]

[tool.hatch.build.targets.wheel.force-include]
"src/inference/catalog" = "inference/catalog"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
